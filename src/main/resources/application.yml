server:
  port: 8081
  servlet:
    context-path: /api/

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000
  jpa:
    hibernate:
      ddl-auto: none

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
      